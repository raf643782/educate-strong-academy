version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: educate_strong_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: es_user
      POSTGRES_PASSWORD: es_password
      POSTGRES_DB: educate_strong
    ports:
      - "5433:5432"
    volumes:
      - educate_strong_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U es_user -d educate_strong"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  educate_strong_data:
